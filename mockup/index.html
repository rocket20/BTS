<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0c11">
<title>Cotizar tarjetas y gafetes | BTS Studio</title>
<meta http-equiv="refresh" content="0; url=../cotizar-tarjeta/">
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#0d0c11;color:#faf6f8;display:grid;place-items:center}
main{max-width:460px;padding:32px;text-align:center}
a{display:inline-block;padding:13px 19px;border-radius:10px;background:#c91641;color:#fff;text-decoration:none;font-weight:750}
p{line-height:1.6;color:#b7aab4}
</style>
<script>
(()=>{'use strict';
 const incoming=new URLSearchParams(location.search).get('tipo');
 const allowed=['vip','fidelizacion','gafete'];
 const type=allowed.includes(incoming)?incoming:'vip';
 location.replace('../cotizar-tarjeta/?tipo='+encodeURIComponent(type));
})();
</script>
</head>
<body>
<main>
<h1>Cotizá tu tarjeta BTS</h1>
<p>La herramienta de demostración ya no está disponible. Podés solicitar directamente una cotización de tarjetas VIP, fidelización o gafetes corporativos.</p>
<a href="../cotizar-tarjeta/">Solicitar cotización</a>
</main>
</body>
</html>
