<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<meta name="robots" content="noindex, nofollow">
<title>Tarjeta digital | BTS Studio NFC</title>
<style>
#profile{width:100%;display:flex;flex-direction:column;align-items:center}#profile[hidden]{display:none!important}
:root{--accent:#ff0037;--bg:#0a0a10;--ink:#f8f7fb;--muted:#aaa8b6;--surface:#17171f}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#0005,#0006),var(--bg);background-image:linear-gradient(180deg,#0004,#0008),var(--nfc-cover,none);background-size:cover;background-position:center;background-attachment:fixed}
main{width:min(100%,475px);min-height:100svh;padding:clamp(55px,11vh,125px) 25px 32px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#090a0c09,#090a0c2a);backdrop-filter:blur(2px)}
.avatar[hidden]{display:none!important}.avatar{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#20202b);display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff20;box-shadow:0 16px 55px #0009}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:var(--nfc-avatar-x,50%) var(--nfc-avatar-y,50%);transform:scale(var(--nfc-avatar-zoom,1));transform-origin:center;position:absolute;inset:0}.avatar{position:relative}.avatar span{font-weight:850;font-size:40px;color:white;letter-spacing:-.07em}
h1{margin:25px 0 6px;text-align:center;font-size:clamp(30px,7vw,38px);line-height:1.06;font-weight:800;letter-spacing:-.055em;overflow-wrap:anywhere}
.tagline{margin:8px 0 20px;line-height:1.55;text-align:center;max-width:360px;font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #ffffff18;border-radius:30px;padding:8px 12px;font-size:10px;color:#bcbac6;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px}.pill:before{content:"";height:6px;width:6px;background:var(--accent);border-radius:50%}
.links{width:100%;display:grid;gap:11px}.links a{display:grid;grid-template-columns:33px minmax(0,1fr) 33px;align-items:center;column-gap:8px;width:100%;padding:14px 17px;min-height:60px;background:var(--nfc-button-bg,#181820);color:var(--nfc-button-text,#ffffff);border:1px solid var(--nfc-button-border,#42404b);border-radius:17px;text-decoration:none;transition:transform .18s,border-color .18s,filter .18s;box-shadow:0 7px 24px #0002}.links a:hover,.links a:focus-visible{transform:translateY(-2px);filter:brightness(1.12);border-color:var(--accent)}.links .glyph{width:33px;height:33px;display:grid;place-items:center;border-radius:11px;background:color-mix(in srgb,var(--accent) 19%,#222);font-weight:800;font-size:14px}.links a strong{min-width:0;text-align:center;font-size:14px;font-weight:650;overflow-wrap:anywhere;color:inherit}.links a .arrow{color:inherit;opacity:.78;font-size:19px;text-align:center}.foot{margin-top:auto;padding-top:55px;text-align:center;font-size:10px;color:#6f6e7a;letter-spacing:.11em}.foot b{color:#b6b2be}
.state{width:100%;text-align:center;margin:15px 0 0;font-size:14px;color:var(--muted);line-height:1.6}#message[hidden]{display:none}
@media(max-width:450px){main{padding-left:22px;padding-right:22px}.avatar{width:98px;height:98px;border-radius:50%}}
@media(prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
<link rel="stylesheet" href="./skins.css?v=20261109-miniweb3">
<link rel="stylesheet" href="./corporate.css?v=20261109-compact2">
</head>
<body>
<main class="nfc-page">
<section id="profile" hidden>
 <header class="nfc-hero"><div class="avatar" id="avatar" aria-hidden="true" hidden></div><div class="nfc-intro"><h1 id="name"></h1><p class="tagline" id="tagline"></p><div class="nfc-business-meta" id="nfcBusinessMeta"><span class="nfc-business-role" id="nfcBusinessRole" hidden></span><span class="nfc-business-location" id="nfcBusinessLocation" hidden></span><div class="nfc-business-tags" id="nfcBusinessTags"></div></div><div class="pill">Conectá con nosotros</div></div></header>
 <div class="nfc-corporate-actions" id="nfcCorporateActions"><a class="nfc-save-contact" id="nfcSaveContact" href="#" download="contacto.vcf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v3h14v-3"/></svg> Guardar contacto</a><button class="nfc-contact-share" id="nfcContactShare" type="button" title="Compartir tarjeta" aria-label="Compartir tarjeta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 14v6h14v-6"/></svg></button></div>
 <nav class="nfc-socials" id="socials" aria-label="Redes sociales"></nav>
 <div class="nfc-content"><section class="nfc-card nfc-primary"><div class="nfc-section-header"><h2>Explorá nuestros enlaces</h2><span>ENLACES</span></div><nav class="links" id="links" aria-label="Enlaces del negocio"></nav></section><aside class="nfc-card nfc-featured"><div class="nfc-section-header"><h2>Contacto y destacados</h2></div><div id="featured" class="nfc-featured-list"></div><div class="nfc-about"><strong>Acerca de nosotros</strong><span id="about"></span></div></aside></div>
</section>
<div id="message" class="state" role="status">Preparando tarjeta digital…</div>
<footer class="foot">TARJETA DIGITAL · <b>BTS STUDIO</b></footer>
</main>
<script src="./brand-icons.js"></script>
<script>
(()=>{'use strict';
const ENDPOINT='https://xwehejgwufwhpkpzjzyt.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_0LR-LUDY7NjJaK5K3qtxPg_1aLupDVz';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search),previewMode=qs.get('preview')==='1';
const slug=String(qs.get('slug')||location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase().trim();
const cardCode=String(qs.get('card')||'').toLowerCase().trim();
const status=$('message');
const ALLOWED=['classic','glass','creator','business','food','beauty','portfolio','realestate','wellness'];
function safeUrl(value){try{const url=new URL(String(value||''));return ['https:','http:'].includes(url.protocol)?url.href:'';}catch{return '';}}
function unavailable(message){status.hidden=false;status.textContent=message;$('profile').hidden=true;}
function validHex(v,fallback){return /^#[a-f\d]{6}$/i.test(String(v||''))?v:fallback;}
function numberClamp(v,min,max,fall){const n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fall;}
function setIcon(el,t){if(window.BTSIcons)window.BTSIcons.set(el,t);else el.textContent='↗';}
let contactObjectUrl='';
let contactShareUrl='';
let currentExecutiveId=null;
function plainText(s,max=140){return String(s||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,max);}
function vcardEscape(v){return plainText(v,200).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,');}
function makeUiGlyph(span,kind){
 span.classList.add('nfc-brand');
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 24 24');
 svg.setAttribute('width','21');svg.setAttribute('height','21');
 svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');
 svg.setAttribute('stroke-width','1.8');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
 const paths=kind==='phone'?['M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L7.4 10.4a16 16 0 0 0 6.2 6.2l1.8-1.8a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z']:['M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z','M22 7l-10 7L2 7'];
 for(const d of paths){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);svg.append(p);}
 span.append(svg);
}
function addBusinessContact(nav,href,label,subtitle,kind){
 const a=document.createElement('a');a.href=href;
 a.setAttribute('aria-label',label+': '+subtitle);
 const badge=document.createElement('span');badge.className='glyph';makeUiGlyph(badge,kind);
 const copy=document.createElement('span');copy.className='nfc-link-copy';
 const title=document.createElement('strong');title.textContent=label;
 const sub=document.createElement('small');sub.className='nfc-link-subtitle';sub.textContent=subtitle;
 copy.append(title,sub);
 const arr=document.createElement('span');arr.className='arrow';arr.textContent='↗';
 a.append(badge,copy,arr);nav.append(a);
}
function businessUrlDetail(value){
 const u=safeUrl(value);
 if(!u)return '';
 try{const p=new URL(u);return plainText((p.hostname.replace(/^www\./,'')+p.pathname.replace(/\/$/,'')).replace(/\/{2,}/g,'/'),65);}
 catch{return '';}
}
function configureCorporate(c,opt){
 const meta=$('nfcBusinessMeta'),role=$('nfcBusinessRole'),loc=$('nfcBusinessLocation'),tags=$('nfcBusinessTags');
 const title=plainText(opt.role,65),place=plainText(opt.location,85);
 role.textContent=title;role.hidden=!title;
 loc.replaceChildren();loc.hidden=!place;
 if(place){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d','M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0zm-8 0a2 2 0 1 0 0 .01');svg.append(path);
  const text=document.createElement('span');text.textContent=place;loc.append(svg,text);
 }
 tags.replaceChildren();
 const values=String(opt.tags||'').split(',').map(x=>plainText(x,22)).filter(Boolean).slice(0,5);
 for(const value of values){const tag=document.createElement('span');tag.textContent=value;tags.append(tag);}
 meta.hidden=!title&&!place&&!values.length;
 if(contactObjectUrl){URL.revokeObjectURL(contactObjectUrl);contactObjectUrl='';}
 const phone=plainText(opt.phone,35),dial=phone.replace(/[^\d+]/g,''),validPhone=/^\+?\d{7,15}$/.test(dial)?dial:'';
 const email=plainText(opt.email,150),validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?email:'';
 const name=plainText(c.business_name||'Contacto',90);
 const cardSlug=plainText(c.slug||slug,48);
 const publicUrl=/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(cardSlug)?location.origin+'/nfc/?slug='+encodeURIComponent(cardSlug)+(cardCode?'&card='+encodeURIComponent(cardCode):''):'';
 contactShareUrl=publicUrl;
 const lines=['BEGIN:VCARD','VERSION:3.0','FN:'+vcardEscape(name),'N:;'+vcardEscape(name)+';;;'];
 if(title)lines.push('TITLE:'+vcardEscape(title));
 if(validPhone)lines.push('TEL;TYPE=WORK,VOICE:'+validPhone);
 if(validEmail)lines.push('EMAIL;TYPE=WORK:'+validEmail);
 if(place)lines.push('NOTE:'+vcardEscape('Ubicación: '+place));
 if(publicUrl)lines.push('URL:'+publicUrl);
 lines.push('END:VCARD');
 contactObjectUrl=URL.createObjectURL(new Blob([lines.join('\r\n')+'\r\n'],{type:'text/vcard;charset=utf-8'}));
 const button=$('nfcSaveContact');button.href=contactObjectUrl;
 button.download=(cardSlug||'contacto').replace(/[^a-z0-9-]/g,'')+'.vcf';
 const nav=$('links');
 if(validPhone)addBusinessContact(nav,'tel:'+validPhone,'Teléfono de trabajo',phone,'phone');
 if(validEmail)addBusinessContact(nav,'mailto:'+validEmail,'Enviar correo',validEmail,'mail');
}
$('nfcContactShare').addEventListener('click',async()=>{
 if(!contactShareUrl)return;
 try{
  if(navigator.share)await navigator.share({title:document.title,url:contactShareUrl});
  else if(navigator.clipboard){await navigator.clipboard.writeText(contactShareUrl);$('nfcContactShare').title='Enlace copiado';}
  else window.prompt('Copiar enlace de la tarjeta',contactShareUrl);
 }catch(e){if(e?.name!=='AbortError')window.prompt('Copiar enlace',contactShareUrl);}
});
window.addEventListener('pagehide',()=>{if(contactObjectUrl)URL.revokeObjectURL(contactObjectUrl);});
function recordEvent(eventType,linkType=''){
 if(!currentExecutiveId)return;
 const payload={executive_id:currentExecutiveId,event_type:eventType,link_type:String(linkType||'').slice(0,35)};
 fetch(ENDPOINT+'/rest/v1/bts_nfc_events',{method:'POST',headers:{apikey:PUBLISHABLE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
}
$('nfcSaveContact').addEventListener('click',()=>recordEvent('contact_download'));
function buildExecutiveCard(company,executive){
 const opt=company.theme_options&&typeof company.theme_options==='object'&&!Array.isArray(company.theme_options)?company.theme_options:{};
 const number=executive.whatsapp_number.replace(/[^0-9]/g,'');
 const companyLinks=Array.isArray(company.links)?company.links.filter(x=>x.type!=='whatsapp'):[];
 const extra=Array.isArray(executive.extra_links)?executive.extra_links:[];
 const socials=[{type:'whatsapp',label:'WhatsApp de '+executive.full_name,url:'https://wa.me/'+number},...extra,...companyLinks].slice(0,15);
 return {...company,slug:company.slug,business_name:executive.full_name,tagline:executive.job_title?executive.job_title+' · '+company.business_name:company.business_name,
 avatar_url:executive.avatar_url||'',is_executive:true,links:socials,theme_options:{...opt,role:executive.job_title||opt.role||'',phone:executive.phone_number||executive.whatsapp_number,email:executive.email||'',tags:opt.tags||''}};
}
function applyCard(c){
 if(!c||typeof c!=='object')return;
 const template=ALLOWED.includes(c.template_id)?c.template_id:'classic';
 const opt=c.theme_options&&typeof c.theme_options==='object'&&!Array.isArray(c.theme_options)?c.theme_options:{};
 document.documentElement.dataset.nfcTemplate=template;
 document.documentElement.dataset.nfcExecutive=c.is_executive?'true':'false';
 document.documentElement.dataset.nfcShape=['pill','square','soft'].includes(opt.shape)?opt.shape:'soft';
 document.documentElement.dataset.nfcFont=['modern','serif','editorial'].includes(opt.font)?opt.font:'modern';
 document.documentElement.dataset.nfcAlign=['center','left'].includes(opt.align)?opt.align:'left';
 document.documentElement.dataset.nfcIcons=opt.icons==='mono'?'mono':'brand';
 document.documentElement.style.setProperty('--nfc-glass',numberClamp(opt.blur,0,40,18)+'px');
 const root=document.documentElement.style;
 root.setProperty('--accent',validHex(c.accent_color,'#ff0037'));
 root.setProperty('--bg',validHex(c.background_color,'#0a0a10'));
 root.setProperty('--ink',validHex(opt.textColor, ['business','food','beauty','wellness'].includes(template)?'#243244':'#f8f7fb'));
 root.setProperty('--muted',validHex(opt.mutedColor,['business','food','beauty','wellness'].includes(template)?'#617082':'#b9b3c8'));
 root.setProperty('--surface',validHex(opt.surfaceColor,['business','food','beauty','wellness'].includes(template)?'#ffffff':'#17171f'));
 document.body.style.setProperty('--ink',validHex(opt.textColor,['business','food','beauty','wellness'].includes(template)?'#243244':'#f8f7fb'));
 document.body.style.setProperty('--surface',validHex(opt.surfaceColor,['business','food','beauty','wellness'].includes(template)?'#ffffff':'#17171f'));
 root.setProperty('--nfc-button-bg',validHex(c.button_bg_color,['business','food','beauty','wellness'].includes(template)?'#ffffff':'#181820'));
 root.setProperty('--nfc-button-text',validHex(c.button_text_color,['business','food','beauty','wellness'].includes(template)?'#223344':'#ffffff'));
 root.setProperty('--nfc-button-border',validHex(c.button_border_color,'#42404b'));
 root.setProperty('--nfc-avatar-x',numberClamp(c.avatar_position_x,0,100,50)+'%');
 root.setProperty('--nfc-avatar-y',numberClamp(c.avatar_position_y,0,100,50)+'%');
 root.setProperty('--nfc-avatar-zoom',String(numberClamp(c.avatar_zoom,100,200,100)/100));
 const cover=safeUrl(c.background_url);
 root.setProperty('--nfc-cover',cover?'url("'+cover.replace(/["\\]/g,'')+'")':'none');
 document.body.dataset.cover=cover?'yes':'no';
 $('name').textContent=String(c.business_name||'Negocio').slice(0,90);
 $('tagline').textContent=String(c.tagline||'').slice(0,180);
 $('about').textContent=String(c.tagline||'Comunicate con nosotros y conocé más de nuestros servicios.').slice(0,180);
 const rawAvatar=String(c.avatar_url||'');
 const draftImage=previewMode&&rawAvatar.length<400000&&/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(rawAvatar);
 const avatar=draftImage?rawAvatar:safeUrl(rawAvatar),cont=$('avatar'),isExecutive=template==='business'&&c.is_executive===true;
 cont.replaceChildren();cont.hidden=!avatar&&!isExecutive;
 function showInitials(){
  cont.replaceChildren();cont.hidden=!isExecutive;
  if(isExecutive){
   const parts=String(c.business_name||'Ejecutivo').trim().split(/\s+/).filter(Boolean);
   const initials=parts.slice(0,2).map(part=>part[0]?.toUpperCase()||'').join('')||'EX';
   const fallback=document.createElement('span');fallback.textContent=initials;cont.append(fallback);
  }
 }
 if(avatar){
  const img=document.createElement('img');img.src=avatar;img.alt=String(c.business_name||'Perfil');
  img.onerror=showInitials;cont.append(img);
 }else if(isExecutive){showInitials();}
 const links=Array.isArray(c.links)?c.links:[];
 const nav=$('links'),social=$('socials'),featured=$('featured');nav.replaceChildren();social.replaceChildren();featured.replaceChildren();
 const socialTypes=new Set(['instagram','facebook','tiktok','whatsapp','youtube','linkedin','x','telegram','pinterest','spotify','threads','snapchat','behance','github']);
 for(const l of links){
  if(!l||typeof l!=='object')continue;
  const url=safeUrl(l.url);if(!url)continue;
  const type=String(l.type||'other').toLowerCase();
  const label=String(l.label||window.BTSIcons?.names?.[type]||'Enlace').slice(0,55);
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer nofollow';a.setAttribute('aria-label','Abrir '+label);
  const badge=document.createElement('span');badge.className='glyph';setIcon(badge,type);
  const title=document.createElement('strong');title.textContent=label;
  const subtitle=document.createElement('small');subtitle.className='nfc-link-subtitle';subtitle.textContent=businessUrlDetail(url);
  const copy=document.createElement('span');copy.className='nfc-link-copy';copy.append(title,subtitle);
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';
  a.append(badge,copy,arrow);nav.append(a);if(currentExecutiveId){a.addEventListener('click',()=>recordEvent(type==='whatsapp'?'whatsapp_click':'link_click',type));}
  if(socialTypes.has(type)){
   const s=document.createElement('a');s.href=url;s.target='_blank';s.rel='noopener noreferrer nofollow';s.title=label;s.setAttribute('aria-label',label);setIcon(s,type);social.append(s);
  }
  if(featured.children.length<4){
   const f=document.createElement('a');f.className='nfc-feature';f.href=url;f.target='_blank';f.rel='noopener noreferrer nofollow';
   const fi=document.createElement('span');setIcon(fi,type);
   const t=document.createElement('b');t.textContent=label;
   const arr=document.createElement('span');arr.textContent='↗';
   f.append(fi,t,arr);featured.append(f);
  }
 }
 if(template==='business')configureCorporate(c,opt);
 if(!nav.children.length){const p=document.createElement('p');p.className='state';p.textContent='Este negocio todavía no agregó enlaces.';nav.append(p);}
 if(!featured.children.length){const p=document.createElement('p');p.textContent='Próximamente';featured.append(p);}
 document.title=String(c.business_name||'Tarjeta digital')+' | BTS Studio';
 $('profile').hidden=false;status.hidden=true;
}
if(previewMode){
 status.textContent='Vista previa lista para editar';
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin || event.data?.source!=='bts-nfc-editor-preview')return;
  applyCard(event.data.card);
 });
 window.parent?.postMessage({source:'bts-nfc-preview-ready'},location.origin);
}else{
 (async()=>{
  if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length>48||slug.length<3){unavailable('Este enlace no corresponde a una tarjeta activa.');return;}
  try{
   const url=ENDPOINT+'/rest/v1/bts_nfc_cards?slug=eq.'+encodeURIComponent(slug)+'&is_active=eq.true&select=id,slug,business_name,tagline,avatar_url,accent_color,background_url,background_color,avatar_position_x,avatar_position_y,avatar_zoom,button_bg_color,button_text_color,button_border_color,links,template_id,theme_options&limit=1';
   const r=await fetch(url,{headers:{apikey:PUBLISHABLE_KEY,Accept:'application/json'},cache:'no-store'});
   if(!r.ok)throw Error('Servicio no disponible');const rows=await r.json(),c=Array.isArray(rows)?rows[0]:null;
   if(!c){unavailable('Esta tarjeta digital no está disponible.');return;}
   if(cardCode){
     if(!/^[a-f0-9]{20}$/.test(cardCode)){unavailable('Esta tarjeta no es válida.');return;}
     const execUrl=ENDPOINT+'/rest/v1/rpc/bts_nfc_public_executive';
     const er=await fetch(execUrl,{method:'POST',headers:{apikey:PUBLISHABLE_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({p_company_slug:slug,p_card_code:cardCode}),cache:'no-store'});
     if(!er.ok)throw Error('No se pudo cargar el ejecutivo.');
     const exes=await er.json(),exec=Array.isArray(exes)?exes[0]:null;
     if(!exec){unavailable('Esta tarjeta ejecutiva está suspendida o no existe.');return;}
     currentExecutiveId=exec.id;
     applyCard(buildExecutiveCard(c,exec));recordEvent('visit');
   }else{currentExecutiveId=null;applyCard(c);}
  }catch(e){unavailable('No se pudo cargar esta tarjeta. Intentá nuevamente.');}
 })();
}
})();
</script>
</body>
</html>
